<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screenshot Extension - 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Screenshot Extension 设置</h1>
      <p class="subtitle">自定义你的截图体验</p>
    </header>

    <main>
      <section class="section">
        <h2>保存设置</h2>
        <div class="form-group">
          <label for="save-path">保存路径</label>
          <select id="save-path">
            <option value="desktop">桌面</option>
            <option value="downloads">下载文件夹</option>
          </select>
          <p class="help-text">截图将保存到选定位置的 Screenshots_日期 文件夹中</p>
        </div>

        <div class="form-group">
          <label for="image-format">图片格式</label>
          <select id="image-format">
            <option value="png">PNG（无损）</option>
            <option value="jpeg">JPEG（较小）</option>
          </select>
        </div>

        <div class="form-group" id="quality-group">
          <label for="image-quality">图片质量（仅 JPEG）</label>
          <input type="range" id="image-quality" min="1" max="100" value="90">
          <span id="quality-value">90</span>
          <p class="help-text">质量越高，文件越大</p>
        </div>
      </section>

      <section class="section">
        <h2>遮罩层设置</h2>
        <div class="form-group">
          <label for="overlay-color">遮罩层颜色</label>
          <div class="color-picker">
            <input type="color" id="overlay-color" value="#0078ff">
            <input type="range" id="overlay-opacity" min="0" max="100" value="20">
            <span id="opacity-value">20%</span>
          </div>
          <p class="help-text">选择颜色和透明度</p>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" id="show-dimensions" checked>
            <span>显示区域尺寸</span>
          </label>
        </div>
      </section>

      <section class="section">
        <h2>快捷键</h2>
        <div class="shortcuts-info">
          <div class="shortcut-row">
            <span class="shortcut-key">Ctrl+Shift+Q</span>
            <span class="shortcut-desc">激活/停用遮罩层</span>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-key">Ctrl+Shift+S</span>
            <span class="shortcut-desc">截取选定区域</span>
          </div>
          <div class="shortcut-row">
            <span class="shortcut-key">Ctrl+Shift+X</span>
            <span class="shortcut-desc">清除遮罩层</span>
          </div>
        </div>
        <p class="help-text">
          要修改快捷键，请访问 
          <a href="#" id="shortcuts-link">chrome://extensions/shortcuts</a>
        </p>
      </section>

      <section class="section">
        <h2>统计信息</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="total-screenshots">0</div>
            <div class="stat-label">总截图数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="session-screenshots">0</div>
            <div class="stat-label">本次截图</div>
          </div>
        </div>
        <button id="reset-stats" class="btn btn-secondary">重置统计</button>
      </section>
    </main>

    <footer>
      <button id="save-btn" class="btn btn-primary">保存设置</button>
      <button id="reset-btn" class="btn btn-secondary">恢复默认</button>
      <div id="status-message" class="status-message"></div>
    </footer>
  </div>

  <script src="options.js"></script>
</body>
</html>
